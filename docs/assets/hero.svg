<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Pana · ESP32-S3 + pantalla ILI9341">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17100d"/>
      <stop offset="55%" stop-color="#120c0a"/>
      <stop offset="100%" stop-color="#0d0908"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="8%" r="62%">
      <stop offset="0%" stop-color="#d9694a" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#c65d3b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c65d3b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="92%" cy="96%" r="52%">
      <stop offset="0%" stop-color="#e5825f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e5825f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efad95"/>
      <stop offset="45%" stop-color="#d9694a"/>
      <stop offset="100%" stop-color="#a5472f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="22" fill="url(#glow)"/>
  <rect width="1200" height="420" rx="22" fill="url(#glow2)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>

  <!-- texto -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="64" y="70" width="168" height="28" rx="14" fill="#d9694a" fill-opacity="0.16" stroke="#d9694a" stroke-opacity="0.42"/>
    <circle cx="82" cy="84" r="4" fill="#e5825f"/>
    <text x="96" y="89" font-size="13" font-weight="600" fill="#efad95" letter-spacing="0.6">ESP32-S3 · ILI9341</text>
    <text x="64" y="176" font-size="84" font-weight="800" fill="url(#brand)" letter-spacing="-2">Pana</text>
    <text x="64" y="224" font-size="28" font-weight="600" fill="#f2e8e3">Un companion con cara</text>
    <text x="64" y="258" font-size="28" font-weight="600" fill="#f2e8e3">para tu escritorio.</text>
    <text x="64" y="308" font-size="17" fill="#ffffff" fill-opacity="0.55">Avatar animado · reloj · datos de tu PC · botones para abrir apps</text>
    <text x="64" y="334" font-size="17" fill="#ffffff" fill-opacity="0.55">Adaptación de pana-companion, de Erik Taveras</text>
  </g>

  <!-- la placa con su pantalla -->
  <g transform="translate(724 52)">
    <rect width="420" height="316" rx="22" fill="#1b1310" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
    <rect x="22" y="22" width="376" height="272" rx="10" fill="#07090d" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- avatar simplificado -->
    <g transform="translate(40 36)">
      <rect x="22" y="6" width="70" height="64" rx="22" fill="#d9a07a"/>
      <path d="M26 20 Q57 -6 88 20 L88 30 L26 30 Z" fill="#d6d8dc"/>
      <rect x="30" y="34" width="22" height="16" rx="7" fill="none" stroke="#1a1d22" stroke-width="4"/>
      <rect x="62" y="34" width="22" height="16" rx="7" fill="none" stroke="#1a1d22" stroke-width="4"/>
      <path d="M26 54 Q57 106 88 54 L88 72 Q57 96 26 72 Z" fill="#2a2224"/>
      <rect x="30" y="76" width="54" height="64" rx="16" fill="#f1f1f5"/>
      <rect x="26" y="136" width="26" height="46" rx="8" fill="#344a7a"/>
      <rect x="62" y="136" width="26" height="46" rx="8" fill="#344a7a"/>
    </g>

    <!-- panel derecho -->
    <text x="188" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#f2e8e3">10:42</text>
    <text x="190" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.5">jueves, 29 de octubre</text>

    <text x="190" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#efad95">CPU</text>
    <rect x="224" y="107" width="150" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="224" y="107" width="62" height="9" rx="4.5" fill="#d9694a"/>
    <text x="190" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#efad95">RAM</text>
    <rect x="224" y="131" width="150" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="224" y="131" width="96" height="9" rx="4.5" fill="#e5825f"/>
    <text x="190" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.55">7 ventanas del navegador</text>

    <rect x="190" y="198" width="86" height="32" rx="10" fill="#d9694a" fill-opacity="0.18" stroke="#d9694a" stroke-opacity="0.5"/>
    <text x="233" y="219" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#f2e8e3">YouTube</text>
    <rect x="286" y="198" width="92" height="32" rx="10" fill="#d9694a" fill-opacity="0.18" stroke="#d9694a" stroke-opacity="0.5"/>
    <text x="332" y="219" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#f2e8e3">Navegador</text>

    <circle cx="206" cy="268" r="4" fill="#5cf08a"/>
    <text x="216" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.5">Servidor conectado</text>
  </g>
</svg>
