; Prueba de pantalla ILI9341 (bus paralelo 16 bits) + táctil XPT2046 en un ESP32-S3 N8R2.
; Cableado en ../docs/cableado-ili9341.md
;   pio run -t upload

[env:s3-n8r2-ili9341]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi   ; flash de 8 MB y PSRAM quad de 2 MB (N8R2)
lib_deps =
  lovyan03/LovyanGFX@^1.2.35
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 115200   ; a más velocidad el USB de este equipo se corta a mitad de la grabación
upload_flags = --before=usb_reset
