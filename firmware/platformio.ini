; Pana · el cuerpo en una placa Waveshare. Elige el entorno de tu placa:
;   pio run -e amoled175 -t upload     ESP32-S3-Touch-AMOLED-1.75 / 1.75C (redonda 466x466)
;   pio run -e p4-4c                   ESP32-P4-WIFI6-Touch-LCD-4C (redonda 720x720) · grabar con tools/flash_p4.sh
; El puerto lo detecta PlatformIO; si tienes varias placas, añade upload_port = /dev/... al entorno.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv   ; app de 7,9 MB: las 16 animaciones del avatar no caben en menos
lib_deps =
  lovyan03/LovyanGFX@^1.2.35
  bblanchon/ArduinoJson@^7.2.0
  links2004/WebSockets@^2.6.1
  tzapu/WiFiManager@^2.0.17
monitor_speed = 115200
; usb-reset entra en modo descarga aunque el firmware esté en bucle de reinicios
upload_flags = --before=usb-reset

; Waveshare ESP32-S3-Touch-AMOLED-1.75 (y 1.75C): CO5300 por QSPI, táctil CST9217, ES8311 + ES7210,
; AXP2101 y acelerómetro QMI8658. USB nativo.
[env:amoled175]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_175
  -DROUND_UI
  -DPACK_AVATAR
  -DLGFX_USE_QSPI

; ESP32-S3 N8R2 (flash de 8 MB, PSRAM quad de 2 MB) con un módulo de 3,2" ILI9341 de 16 bits (MRB3205) y
; táctil XPT2046, apaisado 320x240 y sin audio. Cableado en ../docs/cableado-ili9341.md.
; Usa la plataforma estándar de PlatformIO (la de pioarduino falla al preparar su entorno en algunos equipos).
;   pio run -e s3-ili9341 -t upload      (si no conecta: BOOT + RST y suelta BOOT)
[env:s3-ili9341]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions8.csv
board_build.arduino.memory_type = qio_qspi
upload_speed = 115200        ; a más velocidad el USB de algunos equipos se corta a mitad de la grabación
upload_flags = --before=usb_reset
build_unflags = -std=gnu++11       ; el código usa C++ más nuevo (el de Arduino-ESP32 3.x)
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_S3_ILI9341
  -DPACK_AVATAR
  -DAV_NUM=4
  -DAV_DEN=3

; Waveshare ESP32-P4-WIFI6-Touch-LCD-4C: JD9365 por MIPI-DSI, GT911, ES8311 + ES7210, Wi-Fi 6 por el
; ESP32-C6 (esp_hosted). USB-Serial/JTAG. El esptool de PlatformIO se cuelga con el P4 rev 3: graba
; con ../tools/flash_p4.sh (usa el de ESP-IDF).
[env:p4-4c]
board = esp32-p4_r3
board_build.arduino.memory_type = qio_qspi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_P4
  -DPACK_AVATAR
  -DCONFIG_ESP32_PHY_MAX_WIFI_TX_POWER=20   ; WiFiManager lo da por hecho; con esp_hosted no existe
